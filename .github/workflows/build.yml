name: Android CI (Debug Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-wealth-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # -------------------------------------------------------------
      # NOTE: Release signing, keystore decoding, and Play Store publishing
      # will be configured here later when ready to publish.
      # (e.g., ./gradlew bundleRelease with signing secrets)
      # -------------------------------------------------------------
