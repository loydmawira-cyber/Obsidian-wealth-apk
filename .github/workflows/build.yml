name: Android CI (Debug Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-wealth-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # -------------------------------------------------------------
      # No real release keystore/secrets exist yet, so this "release" build
      # automatically falls back to signing with the debug key (see the
      # signingConfigs fallback in app/build.gradle.kts). It's a real
      # release-type build (minify/proguard rules applied) but NOT signed
      # for the Play Store. Swap in KEYSTORE_BASE64 / STORE_PASSWORD /
      # KEY_PASSWORD secrets + a decode step here later when ready to
      # publish for real.
      # -------------------------------------------------------------
      - name: Build Release APK (debug-signed fallback)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-wealth-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
